# Service Orchestration Configuration
# Defines all services, dependencies, and operational parameters

global:
  health_check_interval: 30  # seconds
  log_level: INFO
  auto_restart: true
  graceful_shutdown_timeout: 10  # seconds

services:
  # Redis Cache Service
  redis:
    command: "cd /workspace/code/redis && python redis_server.py"
    working_dir: "/workspace/code/redis"
    dependencies: []
    health_endpoint: "http://localhost:6379"
    auto_restart: true
    ports:
      - "6379:6379"
    environment:
      - REDIS_MAX_MEMORY=256mb
      - REDIS_MAX_MEMORY_POLICY=allkeys-lru

  # Pub/Sub Message Broker
  pubsub:
    command: "cd /workspace/code/pubsub && python pubsub_server.py"
    working_dir: "/workspace/code/pubsub"
    dependencies:
      - redis
    health_endpoint: "http://localhost:8080/health"
    auto_restart: true
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379

  # Security Service
  security:
    command: "cd /workspace/code/security && python security_server.py"
    working_dir: "/workspace/code/security"
    dependencies:
      - redis
    health_endpoint: "http://localhost:8000/health"
    auto_restart: true
    ports:
      - "8000:8000"

  # LangGraph API
  langgraph_api:
    command: "cd /workspace/code/langgraph_api && python api_server.py"
    working_dir: "/workspace/code/langgraph_api"
    dependencies:
      - redis
      - security
    health_endpoint: "http://localhost:9000/health"
    auto_restart: true
    ports:
      - "9000:9000"

  # Letta API
  letta_api:
    command: "cd /workspace/code/letta_api && python api_server.py"
    working_dir: "/workspace/code/letta_api"
    dependencies:
      - redis
      - security
      - langgraph_api
    health_endpoint: "http://localhost:9001/health"
    auto_restart: true
    ports:
      - "9001:9001"

  # AsymEdge API
  asymedge_api:
    command: "cd /workspace/code/asymedge_api && python api_server.py"
    working_dir: "/workspace/code/asymedge_api"
    dependencies:
      - redis
      - security
    health_endpoint: "http://localhost:9002/health"
    auto_restart: true
    ports:
      - "9002:9002"

  # Composio Service
  composio:
    command: "cd /workspace/code/composio && python composio_server.py"
    working_dir: "/workspace/code/composio"
    dependencies:
      - redis
      - security
      - pubsub
    health_endpoint: "http://localhost:9003/health"
    auto_restart: true
    ports:
      - "9003:9003"

  # CrewAI Service
  crewai:
    command: "cd /workspace/code/crewai && python crewai_server.py"
    working_dir: "/workspace/code/crewai"
    dependencies:
      - redis
      - security
      - langgraph_api
      - letta_api
    health_endpoint: "http://localhost:9004/health"
    auto_restart: true
    ports:
      - "9004:9004"

  # Abacus AI Service
  abacus_ai:
    command: "cd /workspace/code/abacus_ai && python abacus_server.py"
    working_dir: "/workspace/code/abacus_ai"
    dependencies:
      - redis
      - security
      - crewai
      - langgraph_api
    health_endpoint: "http://localhost:9005/health"
    auto_restart: true
    ports:
      - "9005:9005"

  # Workflow Engine
  workflows:
    command: "cd /workspace/code/workflows && python workflow_engine.py"
    working_dir: "/workspace/code/workflows"
    dependencies:
      - redis
      - security
      - pubsub
      - langgraph_api
      - crewai
    health_endpoint: "http://localhost:9006/health"
    auto_restart: true
    ports:
      - "9006:9006"

  # Global Browser Service
  browser:
    command: "cd /workspace/browser && python global_browser.py"
    working_dir: "/workspace/browser"
    dependencies:
      - redis
      - security
    health_endpoint: "http://localhost:9007/health"
    auto_restart: true
    ports:
      - "9007:9007"

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  compression: true
  
  targets:
    - name: redis_data
      path: "/workspace/code/redis/data"
      type: "directory"
    
    - name: service_logs
      path: "/workspace/orchestration/logs"
      type: "directory"
    
    - name: configuration
      path: "/workspace/orchestration/config"
      type: "directory"

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  
  thresholds:
    cpu_usage: 80  # percent
    memory_usage: 85  # percent
    disk_usage: 90  # percent
    response_time: 5000  # milliseconds
  
  alerts:
    - service: all
      condition: "health_check_failed"
      action: "restart_service"
    
    - service: all
      condition: "resource_exceeded"
      action: "send_alert"

# Scaling Configuration
scaling:
  enabled: true
  
  policies:
    - service: "langgraph_api"
      min_instances: 1
      max_instances: 5
      cpu_threshold: 70
      memory_threshold: 80
    
    - service: "letta_api"
      min_instances: 1
      max_instances: 3
      cpu_threshold: 75
      memory_threshold: 85

# Debugging Configuration
debugging:
  enabled: true
  log_level: "DEBUG"
  profiling_enabled: false
  debug_port: 5000
  
  tools:
    - name: "service_inspector"
      command: "python /workspace/orchestration/debugging/service_inspector.py"
    
    - name: "network_analyzer"
      command: "python /workspace/orchestration/debugging/network_analyzer.py"
    
    - name: "log_analyzer"
      command: "python /workspace/orchestration/debugging/log_analyzer.py"