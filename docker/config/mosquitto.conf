# Mosquitto MQTT Broker Configuration for Trading System

# Basic Settings
user mosquitto
max_inflight_messages 1000
max_queued_messages 1000
connection_messages true
log_timestamp true
log_type all
log_type error
log_type warning
log_type notice
log_type information
log_type debug
log_type subscribe
log_type unsubscribe
log_type websockets
log_type plugin
log_type subscription
log_type unsuback
log_type pubcomp
log_type pubrel
log_type puback
log_type connack
log_type auth
log_type particle
log_type forward

# Network Settings
bind_address 0.0.0.0
port 1883
protocol mqtt
allow_anonymous true

# WebSocket Support
listener 9001
protocol websockets

# Persistence
autosave_interval 1800
persistence true
persistence_location /mosquitto/data/
store_clean_interval 10

# Message Settings
max_message_size 268435456
message_size_limit 268435456
retained_persistence true

# Client Settings
max_connections 1000
max_keepalive 65535
persistent_client_expiration 2m

# Security
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/aclfile

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Bridge Configuration (for connecting multiple brokers)
# connection bridge-01
# address broker2.example.com:1883
# topic # out 0
# topic # in 0

# Logging Configuration
log_type debug
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_type websockets

# Performance Settings
sys_interval 10

# WebSocket Settings
http_dir /usr/share/mosquitto/www

# Client Idle Timeout
idle_timeout 60

# Message Timeout
message_timeout 0

# Maximum Packet Size
max_packet_size 268435456

# Protocol Support
protocol mqttv5
protocol mqttv311

# Bridge Protocol Level
bridge_protocol_version mqttv5

# Quality of Service
max_qos 2

# Allow Zero Length Client ID
allow_zero_length_clientid true

# Suppress Subscribe Notifications
suppress_publish_retained true

# TLS/SSL Settings (for production)
# listener 8883
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key
# require_certificate false