# PostgreSQL Configuration for Trading System
# Optimal settings for high-performance trading applications

# Memory Settings
shared_buffers = 1GB                    # 25% of total RAM
effective_cache_size = 3GB             # 75% of total RAM
work_mem = 32MB                        # Per operation memory
maintenance_work_mem = 256MB           # Maintenance operations

# Checkpoint Settings
checkpoint_completion_target = 0.9
wal_buffers = 16MB
checkpoint_segments = 32
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 1GB

# Connection Settings
max_connections = 200
superuser_reserved_connections = 3

# Query Planner
random_page_cost = 1.1                 # SSD optimization
effective_io_concurrency = 200         # SSD optimization

# WAL Settings
wal_level = replica
wal_sync_method = fdatasync
commit_delay = 100                     # Microseconds
commit_siblings = 5

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB

# What to Log
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Log Statements
log_statement = 'mod'                  # Log all DDL and DML statements
log_min_duration_statement = 1000      # Log statements taking >1s

# Autovacuum Settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 200

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# Async I/O
backend_flush_after = 128kB
effective_io_concurrency = 200

# Partitioning (if using table partitioning)
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# Replication Settings (for future use)
max_wal_senders = 10
wal_keep_segments = 32
hot_standby = on
hot_standby_feedback = off

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
stats_temp_directory = 'pg_stat_tmp'

# Locale Settings
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Extensions
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all