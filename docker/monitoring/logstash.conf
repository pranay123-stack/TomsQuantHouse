input {
  file {
    path => "/var/log/nginx/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/nginx_sincedb"
  }
  
  http {
    port => 5000
  }
  
  beats {
    port => 5044
  }
}

filter {
  # Parse Nginx logs
  if [path] =~ "nginx" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
  }
  
  # Parse JSON logs from applications
  if [message] =~ /^ \{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }
  
  # Add container information
  if [docker] {
    mutate {
      add_field => { 
        "container_id" => "%{[docker][container][id]}"
        "container_name" => "%{[docker][container][name]}"
      }
    }
  }
  
  # Categorize logs
  if [level] == "ERROR" or [status] >= 400 {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  if [level] == "WARN" {
    mutate {
      add_tag => [ "warning" ]
    }
  }
  
  # Extract service name from path or tags
  if [path] {
    grok {
      match => { "path" => "/var/log/nginx/(?<service>[^/]+)" }
    }
  }
  
  # Add environment tag
  if [environment] {
    mutate {
      add_field => { "env" => "%{environment}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "trading-system-%{+YYYY.MM.dd}"
    template_name => "trading-system"
    template_pattern => "trading-system-*"
    template => "/usr/share/logstash/templates/trading-system.json"
  }
  
  # Debug output for development
  stdout {
    codec => rubydebug
  }
  
  # Error alerts
  if "error" in [tags] {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "message"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "LogError"
            "severity" => "warning"
            "service" => "%{service}"
          }
          "annotations" => {
            "summary" => "Error detected in %{service}"
            "description" => "%{message}"
          }
        }]
      }
    }
  }
}