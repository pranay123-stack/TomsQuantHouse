# Pytest command line options
def pytest_addoption(parser):
    """Add custom command line options"""
    parser.addoption(
        "--run-slow",
        action="store_true",
        default=False,
        help="Run slow tests"
    )
    parser.addoption(
        "--run-redis",
        action="store_true", 
        default=False,
        help="Run tests that require Redis"
    )
    parser.addoption(
        "--run-api",
        action="store_true",
        default=False, 
        help="Run API endpoint tests"
    )
    parser.addoption(
        "--parallel",
        action="store",
        default="1",
        help="Number of parallel workers for tests"
    )
    parser.addoption(
        "--coverage",
        action="store_true",
        default=False,
        help="Generate test coverage report"
    )
    parser.addoption(
        "--performance",
        action="store_true",
        default=False,
        help="Run performance and stress tests"
    )


def pytest_runtest_setup(item):
    """Setup for each test"""
    # Skip tests based on command line options
    if "slow" in item.keywords and not item.config.getoption("--run-slow"):
        pytest.skip("Slow tests disabled. Use --run-slow to enable.")
    
    if "redis" in item.keywords and not item.config.getoption("--run-redis"):
        pytest.skip("Redis tests disabled. Use --run-redis to enable.")
    
    if "api" in item.keywords and not item.config.getoption("--run-api"):
        pytest.skip("API tests disabled. Use --run-api to enable.")
    
    if "performance" in item.keywords and not item.config.getoption("--performance"):
        pytest.skip("Performance tests disabled. Use --performance to enable.")


# Test data and utilities
class TestDataGenerator:
    """Utility class for generating test data"""
    
    @staticmethod
    def random_price_series(length=100, start_price=100.0, volatility=0.02):
        """Generate random price series"""
        import numpy as np
        returns = np.random.normal(0, volatility, length)
        prices = [start_price]
        for ret in returns[1:]:
            prices.append(prices[-1] * (1 + ret))
        return prices
    
    @staticmethod
    def market_data(symbol="AAPL", days=30):
        """Generate market data for testing"""
        import pandas as pd
        import numpy as np
        from datetime import datetime, timedelta
        
        dates = pd.date_range(
            start=datetime.now() - timedelta(days=days),
            end=datetime.now(),
            freq='D'
        )
        
        prices = TestDataGenerator.random_price_series(len(dates))
        
        return pd.DataFrame({
            'Open': [p * 0.99 for p in prices],
            'High': [p * 1.02 for p in prices],
            'Low': [p * 0.98 for p in prices],
            'Close': prices,
            'Volume': np.random.randint(1000000, 5000000, len(dates))
        }, index=dates)
    
    @staticmethod
    def portfolio_data(positions=None):
        """Generate portfolio data for testing"""
        if positions is None:
            positions = {
                'AAPL': {'quantity': 100, 'weight': 0.25},
                'MSFT': {'quantity': 50, 'weight': 0.20},
                'GOOGL': {'quantity': 30, 'weight': 0.15}
            }
        
        return {
            'total_value': 1000000,
            'positions': positions,
            'cash': 400000,
            'sector_allocation': {
                'Technology': 0.60,
                'Healthcare': 0.15,
                'Finance': 0.10,
                'Other': 0.15
            }
        }


# Global test utilities
def assert_valid_response(response, status_code=200):
    """Assert that a response is valid"""
    assert response.status_code == status_code
    if status_code == 200:
        assert isinstance(response.json(), dict)


def assert_valid_workflow_result(result):
    """Assert that a workflow result has the expected structure"""
    assert 'status' in result
    assert 'workflow_id' in result
    assert result['status'] in ['completed', 'in_progress', 'failed', 'completed_with_recovery']


def assert_valid_approval_result(result):
    """Assert that an approval result has the expected structure"""
    assert 'success' in result
    assert result['success'] in [True, False]
    if result['success']:
        assert 'approval_id' in result


