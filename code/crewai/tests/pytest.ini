# Configure pytest
def pytest_configure(config):
    """Configure pytest with custom markers and settings"""
    config.addinivalue_line("markers", "unit: Unit tests for individual components")
    config.addinivalue_line("markers", "integration: Integration tests for component interactions")
    config.addinivalue_line("markers", "e2e: End-to-end workflow tests")
    config.addinivalue_line("markers", "slow: Slow-running tests that may be skipped in CI")
    config.addinivalue_line("markers", "redis: Tests that require Redis connection")
    config.addinivalue_line("markers", "api: API endpoint tests")
    config.addinivalue_line("markers", "ml: Tests involving ML models and predictions")
    config.addinivalue_line("markers", "risk: Risk management tests")
    config.addinivalue_line("markers", "trading: Trading and execution tests")
    config.addinivalue_line("markers", "performance: Performance and stress tests")


def pytest_collection_modifyitems(config, items):
    """Modify test collection to add markers based on test location and content"""
    for item in items:
        # Add unit marker for tests in unit directory
        if "unit" in str(item.fspath):
            item.add_marker(pytest.mark.unit)
        
        # Add integration marker for tests in integration directory
        if "integration" in str(item.fspath):
            item.add_marker(pytest.mark.integration)
        
        # Add e2e marker for tests in e2e directory
        if "e2e" in str(item.fspath):
            item.add_marker(pytest.mark.e2e)
        
        # Add specific markers based on test content
        test_name = item.name.lower()
        if "redis" in test_name or "memory" in test_name:
            item.add_marker(pytest.mark.redis)
        
        if "api" in test_name or "endpoint" in test_name:
            item.add_marker(pytest.mark.api)
        
        if "ml" in test_name or "prediction" in test_name or "model" in test_name:
            item.add_marker(pytest.mark.ml)
        
        if "risk" in test_name:
            item.add_marker(pytest.mark.risk)
        
        if "trading" in test_name or "execution" in test_name:
            item.add_marker(pytest.mark.trading)
        
        if "performance" in test_name or "stress" in test_name or "load" in test_name:
            item.add_marker(pytest.mark.performance)
            item.add_marker(pytest.mark.slow)


