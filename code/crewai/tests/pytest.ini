# Performance testing helpers
class PerformanceTimer:
    """Context manager for timing test operations"""
    import time
    
    def __init__(self):
        self.start_time = None
        self.end_time = None
        self.duration = None
    
    def __enter__(self):
        self.start_time = time.time()
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        self.end_time = time.time()
        self.duration = self.end_time - self.start_time


def benchmark_function(func, *args, **kwargs):
    """Benchmark a function call"""
    with PerformanceTimer() as timer:
        result = func(*args, **kwargs)
    return result, timer.duration


# Data validation helpers
def validate_market_data(data):
    """Validate market data structure"""
    required_columns = ['Open', 'High', 'Low', 'Close', 'Volume']
    assert all(col in data.columns for col in required_columns)
    assert len(data) > 0
    assert (data['High'] >= data['Low']).all()
    assert (data['Close'] >= data['Low']).all()
    assert (data['Close'] <= data['High']).all()
    assert (data['Volume'] > 0).all()


def validate_portfolio_data(data):
    """Validate portfolio data structure"""
    assert 'total_value' in data
    assert 'positions' in data
    assert 'cash' in data
    assert data['total_value'] > 0
    assert data['cash'] >= 0
    assert len(data['positions']) > 0


def validate_trade_request(request):
    """Validate trade request structure"""
    required_fields = ['symbol', 'side', 'quantity', 'order_type']
    assert all(field in request for field in required_fields)
    assert request['symbol']
    assert request['side'] in ['buy', 'sell']
    assert request['quantity'] > 0
    assert request['order_type'] in ['market', 'limit', 'stop', 'stop_limit']


