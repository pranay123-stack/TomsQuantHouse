# Redis Configuration for Trading Framework
# Multiple database setup for different data types

# Network and Security
bind 0.0.0.0
protected-mode yes
requirepass trading_framework_2025

# Database Configuration
# db0 = Predictions cache (ML models, market predictions, signals)
# db1 = Agent memory (AI agent states, conversations, decisions)
# db2 = Graph state (trading relationships, market data graph)
# db3 = Entity memory (user profiles, market entities, metadata)

# Performance and Memory
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Logging
loglevel notice
logfile ""

# Database specific settings
databases 16

# AOF (Append Only File) - Optional for critical data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Client connections
tcp-keepalive 300
timeout 0

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Keyspace events notifications (for pub/sub)
notify-keyspace-events Ex

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64