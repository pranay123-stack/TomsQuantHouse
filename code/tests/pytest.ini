[tool:pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --junitxml=reports/junit.xml
    --cov-fail-under=80
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance benchmarking tests
    e2e: End-to-end pipeline tests
    slow: Tests that take longer than 5 seconds
    redis: Tests requiring Redis service
    letta: Tests requiring Letta service
    abacus: Tests requiring Abacus.AI service
    quantconnect: Tests requiring QuantConnect service
    live: Tests that hit real services (not mocks)
    mock: Tests using mocks/fixtures