[tool:pytest]
# Test Discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Timeout Settings
timeout = 300
timeout_method = thread

# Coverage Settings
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=testing
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --cov-branch
    --junit-xml=test-results.xml
    --json-report
    --json-report-file=test-results.json
    --html=html-report.html
    --self-contained-html

# Markers - Categorize tests for selective execution
markers =
    # Pipeline Testing
    pipeline: Tests for data pipeline flow (market data → features → predictions → redis → lean → trading)
    end_to_end: End-to-end pipeline tests
    data_flow: Data transformation and flow tests
    
    # Agent Testing
    agents: Agent coordination and communication tests
    agent_communication: Multi-agent communication tests
    decision_making: Agent decision-making workflow tests
    conflict_resolution: Agent conflict resolution tests
    consensus: Agent consensus mechanism tests
    
    # API Testing
    api: API integration tests
    redis_api: Redis API operations tests
    letta_api: Letta service API tests
    abacus_api: Abacus.AI API tests
    quantconnect_api: QuantConnect/LEAN API tests
    graphql: GraphQL endpoint tests
    websocket: WebSocket connection tests
    rate_limiting: API rate limiting tests
    
    # Performance Testing
    performance: Performance and load testing
    load_test: Load and stress testing
    throughput: Throughput benchmarking tests
    concurrent: Concurrent request testing
    stress: Stress testing and breaking points
    monitoring: Resource monitoring tests
    benchmark: Performance benchmark tests
    
    # Disaster Recovery Testing
    recovery: Disaster recovery and backup tests
    backup: Backup creation and validation tests
    restore: Data restore procedure tests
    failover: System failover testing
    corruption_recovery: Data corruption recovery tests
    resilience: System resilience validation
    
    # Security Testing
    security: Security and vulnerability assessment
    vulnerability: Vulnerability scanning tests
    authentication: Authentication and authorization tests
    encryption: Encryption strength validation tests
    owasp: OWASP Top 10 security tests
    injection: SQL injection and code injection tests
    xss: Cross-site scripting protection tests
    auth_bypass: Authentication bypass tests
    
    # CI/CD and Automation
    ci_cd: CI/CD automation and orchestration tests
    parallel: Parallel test execution tests
    orchestration: Test orchestration and management
    reporting: Test reporting and artifact management
    notification: Alert and notification tests
    
    # Test Categories
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (full system)
    smoke: Smoke tests (basic functionality)
    regression: Regression tests (bug fixes)
    acceptance: Acceptance tests (user requirements)
    
    # Execution Types
    quick: Quick tests (under 10 seconds)
    slow: Slow tests (over 30 seconds)
    live: Tests requiring live services (not mocks)
    mock: Tests using mocks and fixtures
    database: Tests requiring database access
    network: Tests requiring network access
    
    # Platform Specific
    windows: Windows-specific tests
    linux: Linux-specific tests
    macos: macOS-specific tests
    docker: Docker container tests
    
    # Test Data
    large_data: Tests using large datasets
    real_data: Tests using real production data
    synthetic: Tests using synthetic data
    
    # Service Specific
    redis: Redis-specific tests
    letta: Letta service tests
    abacus: Abacus.AI service tests
    quantconnect: QuantConnect/LEAN tests

# Minimum Version
minversion = 7.0

# Filter Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:.*
    ignore::pytest.PytestCollectionWarning
    error::pytest.PytestUnraisableExceptionWarning

# Log Settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Parallel Execution
# Number of workers for parallel execution (0 = auto-detect)
# Set to 0 for auto-detection, or specify a number
# workers = 0

# Auto-discovery Settings
collect_ignore = [
    "setup.py",
    "docs/",
    ".tox/",
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    "*.egg-info/"
]

# JMESPath for JSON report
junit_suite_name = Trading Pipeline Tests
junit_logging = system-out
junit_log_passing_tests = false

# Test Session Settings
markers_expression = "not slow"

# Auto-use fixtures
# usefixtures = cleanup, test_data

# Custom pytest configuration for specific test types
[pytest.mark.unit]
addopts = --tb=short -x

[pytest.mark.integration]
addopts = --tb=line

[pytest.mark.e2e]
addopts = --tb=short --maxfail=1

[pytest.mark.performance]
addopts = --tb=no --timeout=600

[pytest.mark.security]
addopts = --tb=line --maxfail=5

[pytest.mark.load_test]
addopts = --tb=no --timeout=900

[pytest.mark.slow]
addopts = --tb=short

# Environment-specific settings
[pytest.mark.live]
# Skip live tests in CI by default
# Add --live flag to pytest command to run these tests
addopts = --maxfail=1

# Development settings (run with --dev flag)
[pytest.mark.dev]
addopts = --tb=long --verbose --capture=no