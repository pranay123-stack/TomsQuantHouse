# Filebeat Configuration for Trading System Log Collection

filebeat.inputs:
- type: container
  enabled: true
  paths:
    - /var/lib/docker/containers/*/*.log
  processors:
    - add_docker_metadata: ~
    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        matchers:
        - logs_path:
            logs_path: "/var/lib/docker/containers/"
    - drop_fields:
        fields: ["ecs", "agent", "host", "input", "log.file.path"]
    - if:
        contains:
          kubernetes.container.name: "langgraph-api"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "trading"
              service: "langgraph-api"
    - if:
        contains:
          kubernetes.container.name: "asymedge-api"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "trading"
              service: "asymedge-api"
    - if:
        contains:
          kubernetes.container.name: "abacus-ai"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "trading"
              service: "abacus-ai"
    - if:
        contains:
          kubernetes.container.name: "letta-server"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "trading"
              service: "letta-server"
    - if:
        contains:
          kubernetes.container.name: "postgres"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "database"
              service: "postgres"
    - if:
        contains:
          kubernetes.container.name: "redis"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "database"
              service: "redis"
    - if:
        contains:
          kubernetes.container.name: "nginx"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "infrastructure"
              service: "nginx"
    - if:
        contains:
          kubernetes.container.name: "prometheus"
      then:
        - add_fields:
            target: ""
            fields:
              log_type: "monitoring"
              service: "prometheus"

# System logs
- type: log
  enabled: true
  paths:
    - /var/log/syslog
    - /var/log/auth.log
    - /var/log/messages
  fields:
    log_type: "system"
  fields_under_root: true

# Application-specific log paths
- type: log
  enabled: true
  paths:
    - /var/log/containers/*trading*.log
    - /var/log/containers/*api*.log
    - /var/log/containers/*database*.log
  fields:
    log_type: "application"
  fields_under_root: true

# Security logs
- type: log
  enabled: true
  paths:
    - /var/log/auth.log
    - /var/log/secure
    - /var/log/audit/*
  fields:
    log_type: "security"
  fields_under_root: true

# Kubernetes logs
- type: log
  enabled: true
  paths:
    - /var/log/kubelet.log
    - /var/log/kube-apiserver.log
    - /var/log/kube-controller-manager.log
    - /var/log/kube-scheduler.log
  fields:
    log_type: "kubernetes"
  fields_under_root: true

# Performance monitoring
- type: log
  enabled: true
  paths:
    - /var/log/*.performance.log
    - /var/log/*performance*.log
  fields:
    log_type: "performance"
  fields_under_root: true

# Multiline patterns for stack traces
multiline.pattern: '^[[:space:]]+(at |Caused by:|... [0-9]+ more)'
multiline.negate: false
multiline.match: after
multiline.timeout: 10s

# Global settings
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# Output configuration
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: "elastic"
  password: "changeme"
  index: "filebeat-%{[fields.log_type]}-%{+yyyy.MM.dd}"
  template.name: "filebeat"
  template.pattern: "filebeat-*"
  template.fields: "fields.yml"
  template.overwrite: false

# Logstash output for log processing
output.logstash:
  hosts: ["logstash:5044"]

# Console output for debugging
output.console:
  enabled: false
  pretty: true

# Monitoring
xpack.monitoring.enabled: true
xpack.monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: "elastic"
  password: "changeme"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Registry
filebeat.registry.path: /var/lib/filebeat/registry

# Prospectors
filebeat.prospectors:
- type: log
  paths:
    - /var/log/containers/*.log
  json.keys_under_root: true
  json.add_error_key: true

# Processors for data enrichment
processors:
- add_host_metadata:
    when.not.contains.tags: forwarded
- add_cloud_metadata: ~
- add_docker_metadata: ~
- add_kubernetes_metadata: ~
- drop_fields:
    fields: ["ecs", "agent", "host", "input", "log.file.path"]
- decode_json_fields:
    fields: ["message", "log"]
    target: "json"
    overwrite_keys: true
- if:
    contains:
      message: "ERROR"
  then:
    - add_fields:
        target: ""
        fields:
          severity: "error"
- if:
    contains:
      message: "WARN"
  then:
    - add_fields:
        target: ""
        fields:
          severity: "warning"

# Shipper
shipper:
  name: "filebeat-trading-system"
  tags: ["trading", "production", "docker"]