# Fluent Bit Configuration for Trading System

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Stats         /var/log/fluent-bit/stats
    Log_File      /var/log/fluentbit/fluent-bit.log
    Log_Format    json
    Health_Check  On

[INPUT]
    Name              tail
    Path              /var/log/containers/*trading*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs.db

[INPUT]
    Name              tail
    Path              /var/log/containers/*api*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs-api.db

[INPUT]
    Name              tail
    Path              /var/log/containers/*database*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs-db.db

[INPUT]
    Name              tail
    Path              /var/log/containers/*monitoring*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs-monitoring.db

[INPUT]
    Name              tail
    Path              /var/log/containers/*redis*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs-redis.db

[INPUT]
    Name              tail
    Path              /var/log/containers/*nginx*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit-kubelogs-nginx.db

[INPUT]
    Name              systemd
    Tag               host.*
    Path              /var/log/journal
    DB                /var/log/fluentbit-systemd.db
    Max_Entries       1000

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Tag               syslog.*
    Parser            syslog

[INPUT]
    Name              tail
    Path              /var/log/auth.log
    Tag               auth.*
    Parser            syslog

# Kubernetes filter for metadata enrichment
[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On

# Trading-specific filters
[FILTER]
    Name                modify
    Match               kube.*
    Add                 environment production
    Add                 cluster trading-system
    Add                 monitoring_stack fluentbit

[FILTER]
    Name                grep
    Match               kube.*
    Regex               log /trading|algorithm|market|risk|position/i

# Performance metrics extraction
[FILTER]
    Name                modify
    Match               kube.*
    Add                 log_type performance
    Add                 performance_category all

# Error detection
[FILTER]
    Name                grep
    Match               kube.*
    Regex               log ERROR|CRITICAL|Exception

[FILTER]
    Name                modify
    Match               kube.*
    Add                 severity error

# Trading decision extraction
[FILTER]
    Name                parser
    Match               kube.*
    Key_Name            log
    Parser              json
    Reserve_Data        On

[FILTER]
    Name                modify
    Match               kube.*
    If                  log =~ /decision/i
    Add                 log_type trading_decision
    Add                 category trading

[FILTER]
    Name                modify
    Match               kube.*
    If                  log =~ /risk/i
    Add                 log_type risk_assessment
    Add                 category risk

[FILTER]
    Name                modify
    Match               kube.*
    If                  log =~ /performance/i
    Add                 log_type performance
    Add                 category performance

# Security log processing
[FILTER]
    Name                grep
    Match               kube.*
    Regex               log authentication|authorization|security|threat/i

[FILTER]
    Name                modify
    Match               kube.*
    Add                 log_type security

# Business metrics extraction
[FILTER]
    Name                modify
    Match               kube.*
    If                  log =~ /volume|profit|loss/i
    Add                 log_type business_metric

# Timestamp normalization
[FILTER]
    Name                modify
    Match               kube.*
    Add                 timestamp %{time:%Y-%m-%dT%H:%M:%S.%L%z}

# Field additions for Elasticsearch
[FILTER]
    Name                modify
    Match               kube.*
    Add                 @timestamp ${timestamp}
    Add                 source fluentbit

# Performance optimization
[FILTER]
    Name                lua
    Match               kube.*
    Script              /fluent-bit/scripts/performance.lua
    Call                process_logs

# Security filters - data sanitization
[FILTER]
    Name                grep
    Match               kube.*
    Exclude             log /password|token|key|secret/i

[FILTER]
    Name                modify
    Match               kube.*
    If                  log =~ /password|token|key|secret/i
    Replace             log [REDACTED]

# Output to Elasticsearch
[OUTPUT]
    Name  es
    Match kube.*
    Host  elasticsearch
    Port  9200
    Index filebeat-kube-%Y.%m.%d
    Type  _doc
    HTTP_User elastic
    HTTP_Passwd changeme
    Logstash_Format On
    Logstash_Prefix filebeat-kube
    Logstash_Prefix_Key log_type
    Retry_Limit False
    Buffer_Size 25MB
    Suppress_Type_Name On

# Separate output for trading logs
[OUTPUT]
    Name  es
    Match kube.*
    HTTP_User elastic
    HTTP_Passwd changeme
    Index trading-logs-%Y.%m.%d
    Type _doc
    Logstash_Format On
    Logstash_Prefix trading-logs
    Logstash_Prefix_Key log_type
    Include_Tag_Key true
    Tag_Key log_type
    Retry_Limit False

# Separate output for security logs
[OUTPUT]
    Name  es
    Match kube.*
    HTTP_User elastic
    HTTP_Passwd changeme
    Index security-logs-%Y.%m.%d
    Type _doc
    Logstash_Format On
    Logstash_Prefix security-logs
    Logstash_Prefix_Key log_type
    Include_Tag_Key true
    Tag_Key log_type
    Retry_Limit False

# Performance logs to separate index
[OUTPUT]
    Name  es
    Match kube.*
    HTTP_User elastic
    HTTP_Passwd changeme
    Index performance-logs-%Y.%m.%d
    Type _doc
    Logstash_Format On
    Logstash_Prefix performance-logs
    Logstash_Prefix_Key log_type
    Include_Tag_Key true
    Tag_Key log_type
    Retry_Limit False

# Error logs to alert index
[OUTPUT]
    Name  es
    Match kube.*
    HTTP_User elastic
    HTTP_Passwd changeme
    Index error-alerts-%Y.%m.%d
    Type _doc
    Logstash_Format On
    Logstash_Prefix error-alerts
    Logstash_Prefix_Key log_type
    Include_Tag_Key true
    Tag_Key log_type
    Retry_Limit False

# JSON format output for high-throughput scenarios
[OUTPUT]
    Name  stdout
    Match kube.*
    Format json
    json_date_format iso8601

# Log rotation
[OUTPUT]
    Name  forward
    Match kube.*
    Host  logstash
    Port  24224
    Buffer_Size 25MB
    Retry_Limit False

# Health check endpoint
[OUTPUT]
    Name  http
    Match kube.*
    Host  alertmanager
    Port  9093
    URI   /api/v1/alerts
    Header Content-Type application/json
    Body_format json
    HTTP_User admin
    HTTP_Passwd changeme