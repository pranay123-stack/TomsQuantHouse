# Logstash Pipeline Configuration for Trading System

input {
  # Beats input for Filebeat and Metricbeat
  beats {
    port => 5044
    codec => json
  }
  
  # TCP input for direct log ingestion
  tcp {
    port => 5000
    codec => json_lines
    type => "tcp_logs"
  }
  
  # Redis input for queue-based log processing
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "logs"
    codec => json
    type => "redis_logs"
  }
  
  # HTTP input for webhooks
  http {
    port => 8080
    type => "http_logs"
    codec => "json"
  }
  
  # Kafka input for real-time log streaming
  kafka {
    bootstrap_servers => "kafka-logs:9092"
    topics => ["trading-logs", "system-logs", "error-logs"]
    consumer_threads => 4
    codec => json
    type => "kafka_logs"
  }
}

filter {
  # Common processing for all logs
  if [type] == "trading" or [fields][log_type] == "trading" {
    # Trading-specific log processing
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:thread}\] %{DATA:logger} - %{GREEDYDATA:message}" 
      }
    }
    
    # Extract trading-specific fields
    if [message] =~ /trading_decision/ {
      json {
        source => "message"
        target => "trading_data"
      }
      
      # Parse trading decision details
      if [trading_data][decision] {
        mutate {
          add_field => {
            "decision_id" => "%{[trading_data][decision][id]}"
            "algorithm" => "%{[trading_data][decision][algorithm]}"
            "symbol" => "%{[trading_data][decision][symbol]}"
            "side" => "%{[trading_data][decision][side]}"
            "quantity" => "%{[trading_data][decision][quantity]}"
            "price" => "%{[trading_data][decision][price]}"
            "outcome" => "%{[trading_data][decision][outcome]}"
            "profit_loss" => "%{[trading_data][decision][profit_loss]}"
          }
        }
      }
      
      # Add performance metrics
      if [trading_data][performance] {
        mutate {
          add_field => {
            "latency_ms" => "%{[trading_data][performance][latency]}"
            "throughput" => "%{[trading_data][performance][throughput]}"
          }
        }
      }
    }
    
    # Parse risk metrics
    if [message] =~ /risk_assessment/ {
      json {
        source => "message"
        target => "risk_data"
      }
      
      mutate {
        add_field => {
          "risk_score" => "%{[risk_data][risk_score]}"
          "var_95" => "%{[risk_data][var_95]}"
          "max_drawdown" => "%{[risk_data][max_drawdown]}"
          "position_size" => "%{[risk_data][position_size]}"
        }
      }
    }
    
    # Add geographic location for regulatory compliance
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
  }
  
  # System logs processing
  if [type] == "system" or [fields][log_type] == "system" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:process}\] %{DATA:component} - %{GREEDYDATA:message}" 
      }
    }
    
    # Parse service health metrics
    if [message] =~ /health_check/ {
      json {
        source => "message"
        target => "health_data"
      }
      
      mutate {
        add_field => {
          "service_name" => "%{[health_data][service]}"
          "status" => "%{[health_data][status]}"
          "response_time_ms" => "%{[health_data][response_time]}"
          "uptime_seconds" => "%{[health_data][uptime]}"
        }
      }
    }
  }
  
  # Security logs processing
  if [type] == "security" or [fields][log_type] == "security" {
    # Parse security events
    if [message] =~ /authentication/ {
      grok {
        match => { 
          "message" => "Authentication %{WORD:auth_action} from %{IP:client_ip} for user %{USERNAME:username}" 
        }
      }
    }
    
    if [message] =~ /authorization/ {
      grok {
        match => { 
          "message" => "Authorization %{WORD:auth_action} for user %{USERNAME:username} on resource %{DATA:resource}" 
        }
      }
    }
    
    # Extract IP addresses and user agents
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "client_geoip"
      }
    }
    
    # Detect potential threats
    if [level] == "ERROR" and [message] =~ /failed|denied|unauthorized/ {
      mutate {
        add_tag => ["security_threat"]
      }
    }
  }
  
  # Application logs processing
  if [type] == "application" or [fields][log_type] == "application" {
    # Parse API request logs
    if [message] =~ /HTTP/ {
      grok {
        match => { 
          "message" => "%{IP:client_ip} - %{USERNAME:user} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{DATA:request} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:response_size} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" 
        }
      }
      
      # Calculate response time if available
      if [response_time] {
        ruby {
          code => "
            event.set('response_time_seconds', event.get('response_time').to_f / 1000.0)
          "
        }
      }
    }
  }
  
  # Database logs processing
  if [type] == "database" or [fields][log_type] == "database" {
    # PostgreSQL log parsing
    if [message] =~ /duration:/ {
      grok {
        match => { 
          "message" => "duration: %{NUMBER:db_duration} ms %{WORD:db_statement_type} %{GREEDYDATA:db_query}" 
        }
      }
      
      # Convert duration to seconds
      ruby {
        code => "
          event.set('db_duration_seconds', event.get('db_duration').to_f / 1000.0)
        "
      }
    }
  }
  
  # Common timestamp processing
  if ![timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
    }
  }
  
  # Standardize log levels
  mutate {
    lowercase => [ "level" ]
  }
  
  # Add environment information
  mutate {
    add_field => {
      "environment" => "production"
      "application" => "trading-system"
      "version" => "1.0.0"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs" ]
  }
  
  # Security: sanitize sensitive data
  if [message] =~ /password|token|key/i {
    mutate {
      replace => { "message" => "[SANITIZED - Sensitive data removed]" }
    }
  }
  
  # Add threat detection tags
  if [message] =~ /injection|script|xss|csrf/i {
    mutate {
      add_tag => ["potential_threat"]
    }
  }
  
  # Performance monitoring
  if [latency_ms] or [response_time] or [db_duration] {
    mutate {
      add_tag => ["performance_log"]
    }
  }
}

output {
  # Elasticsearch output for log storage and analysis
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme"
    index => "trading-logs-%{+YYYY.MM.dd}"
    template_name => "trading-logs"
    template_pattern => "trading-logs-*"
    template => "/usr/share/logstash/templates/trading-logs.json"
    
    # Performance optimization
    flush_size => 1000
    idle_flush_time => 1
  }
  
  # Separate outputs based on log type
  if "trading" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "changeme"
      index => "trading-%{+YYYY.MM.dd}"
    }
  }
  
  if "security_threat" in [tags] or "potential_threat" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "changeme"
      index => "security-alerts-%{+YYYY.MM.dd}"
    }
    
    # Alert notification
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      content_type => "application/json"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "SecurityThreat"
            "severity" => "critical"
            "instance" => "%{client_ip}"
          }
          "annotations" => {
            "summary" => "Security threat detected"
            "description" => "%{message}"
          }
        }]
      }
    }
  }
  
  # Performance logs to separate index
  if "performance_log" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "changeme"
      index => "performance-%{+YYYY.MM.dd}"
    }
  }
  
  # Console output for development/debugging
  if [environment] == "development" {
    stdout {
      codec => rubydebug
    }
  }
  
  # Kafka output for log streaming
  kafka {
    bootstrap_servers => "kafka-logs:9092"
    topic => "processed-logs"
    codec => json
  }
  
  # Metrics aggregation
  if [trading_decision] or [risk_score] {
    file {
      path => "/var/log/logstash/trading-metrics.log"
      codec => json
    }
  }
}