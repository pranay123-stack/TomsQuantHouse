receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832
  
  zipkin:
    endpoint: 0.0.0.0:9411
  
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  
  memory_limiter:
    limit_mib: 512
  
  resource:
    attributes:
      - key: service.name
        value: "trading-system"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert
  
  attributes:
    actions:
      - key: trading.platform
        value: "asymedge"
        action: upsert
      - key: trading.environment
        from_attribute: deployment.environment
        action: upsert
  
  spanmetrics:
    metrics_exporter: prometheus
    processor:
      metrics:
        latency:
          enabled: true
          unit: ms
        call_count:
          enabled: true

exporters:
  # Jaeger exporter for distributed tracing
  jaeger:
    endpoint: jaeger-collector:14250
    tls:
      insecure: true
    compression: none
  
  # Elasticsearch exporter for trace storage
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    index: jaeger-span-{yyyy-MM-dd}
    auth:
      username: elastic
      password: changeme
    tls:
      ca_file: /etc/ssl/certs/elastic-certificates.p12
  
  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8888"
    const_labels:
      cluster: "trading-system"
      environment: "production"
  
  # Kafka exporter for trace streaming
  kafka:
    brokers: ["kafka:9092"]
    topic: jaeger-traces
    protocol_version: 2.0.0
    tls:
      insecure: true
  
  # Logging exporter for debugging
  logging:
    loglevel: info
  
  # Azure Monitor exporter (if using Azure)
  azuremonitor:
    connection_string: ${AZURE_MONITOR_CONNECTION_STRING}
    resource_per_virtual_machine_scale_set:
      namespace: "trading-system"
      name: "${COMPUTERNAME}"
    instrumentation_key: ${AZURE_MONITOR_INSTRUMENTATION_KEY}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Tracing pipeline
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [jaeger, elasticsearch, logging]
    
    # Metrics pipeline for span metrics
    metrics/span:
      receivers: [otlp]
      processors: [memory_limiter, resource, spanmetrics, batch]
      exporters: [prometheus]
    
    # General metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [elasticsearch, logging]

# Resource configuration for specific services
service:
  telemetry:
    logs:
      level: "info"
      development: false
      encoding: "console"
      disable_colors: false
    metrics:
      level: "detailed"
      address: "0.0.0.0:8888"